<!DOCTYPE html>
<html>
<head>
  <title>System Interface</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: #00ff00;
      font-family: monospace;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .overlay {
      position: relative;
      z-index: 1;
      padding: 20px;
    }

    .warning {
      color: red;
      font-size: 28px;
      text-align: center;
      margin-top: 20px;
      animation: flicker 0.15s infinite;
    }

    @keyframes flicker {
      0% {opacity: 1;}
      50% {opacity: 0.4;}
      100% {opacity: 1;}
    }

    .bar {
      width: 100%;
      background: #222;
      margin-top: 20px;
    }

    .progress {
      height: 20px;
      width: 0%;
      background: lime;
      transition: 0.3s;
    }

    #log {
      margin-top: 20px;
      white-space: pre-line;
      font-size: 14px;
    }

    .glitch {
      animation: glitch 0.2s infinite;
    }

    @keyframes glitch {
      0% {transform: translate(0,0);}
      25% {transform: translate(2px,-2px);}
      50% {transform: translate(-2px,2px);}
      75% {transform: translate(2px,2px);}
      100% {transform: translate(0,0);}
    }

    #map {
      margin-top: 20px;
      width: 100%;
      height: 150px;
      background: #111;
      border: 1px solid #0f0;
      position: relative;
      overflow: hidden;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: red;
      border-radius: 50%;
      position: absolute;
      animation: move 2s infinite;
    }

    @keyframes move {
      0% {transform: translate(0,0);}
      50% {transform: translate(200px,50px);}
      100% {transform: translate(0,0);}
    }
  </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="overlay glitch">
  <div class="warning">⚠ SYSTEM BREACH SIMULATION ⚠</div>

  <div class="bar">
    <div class="progress" id="progress"></div>
  </div>

  <div id="log"></div>

  <div id="map">
    <div class="dot"></div>
  </div>
</div>

<script>
/* MATRIX BACKGROUND */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

let letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
letters = letters.split("");

let fontSize = 14;
let columns = canvas.width / fontSize;

let drops = [];
for (let x = 0; x < columns; x++) drops[x] = 1;

function drawMatrix() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#0F0";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    let text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
      drops[i] = 0;

    drops[i]++;
  }
}
setInterval(drawMatrix, 33);

/* FAKE TERMINAL */
const messages = [
  "Initializing scan...",
  "Connecting to remote node...",
  "Bypassing firewall...",
  "Accessing system files...",
  "Extracting metadata...",
  "Scanning device storage...",
  "Locating IP routes...",
  "Compiling results..."
];

let log = document.getElementById("log");
let progress = document.getElementById("progress");

let i = 0;
let percent = 0;

let interval = setInterval(() => {
  if (i < messages.length) {
    log.textContent += "> " + messages[i] + "\n";
    i++;
    percent += 12;
    progress.style.width = percent + "%";
  } else {
    clearInterval(interval);

    setTimeout(() => {
      document.body.innerHTML = `
        <div style="color:cyan; text-align:center; margin-top:120px; font-family:monospace;">
          <h1>SIMULATION COMPLETE</h1>
          <p>This is a visual hacker effect demo.</p>
          <p>No real data was accessed, scanned, or transmitted.</p>
        </div>
      `;
    }, 1500);
  }
}, 1000);
</script>

</body>
</html>
